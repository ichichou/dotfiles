title: "07. Control Key"
rules:
- description: "7. Control Key"
  manipulators:

  # Escape -> Left Control {{{

  # Esc -> Esc/LCtrl
  # Mac 標準のリマップ機能で Caps Lock -> Esc とすることが前提
  - type: basic
    from:
      key_code: escape
      modifiers:
        optional:
        - any
    to:
    - key_code: left_control
      lazy: true
    to_if_alone:
    - key_code: escape

  # }}}

  # Left Control Key Mapping {{{

  # LCtrl-J -> Kana
  # Ctrl-J の入力をアプリに取られて IME に渡らないことが多いため、
  # これを設定しておいたほうが不便がない
  - type: basic
    from:
      key_code: j
      modifiers:
        mandatory:
        - left_control
    to:
    - key_code: japanese_kana
      repeat: false

  # LCtrl-L -> Eisuu
  # Ctrl-J と同様の事情
  - type: basic
    from:
      key_code: l
      modifiers:
        mandatory:
        - left_control
    to:
    - key_code: japanese_eisuu
      repeat: false

  # LCtrl-M -> Return
  - type: basic
    from:
      key_code: m
      modifiers:
        mandatory:
        - left_control
        optional:
        - any
    to:
    - key_code: return_or_enter
      repeat: false

  # LCtrl-N -> Cmd-Down
  - type: basic
    from:
      key_code: "n"
      modifiers:
        mandatory:
        - left_control
        optional:
        - any
    to:
    - key_code: down_arrow
      modifiers:
      - command
      repeat: false

  # LCtrl-P -> Cmd-Up
  - type: basic
    from:
      key_code: p
      modifiers:
        mandatory:
        - left_control
        optional:
        - any
    to:
    - key_code: up_arrow
      modifiers:
      - command
      repeat: false

  # LCtrl-H -> Delete
  - type: basic
    from:
      key_code: h
      modifiers:
        mandatory:
        - left_control
        optional:
        - any
    to:
    - key_code: delete_or_backspace
      repeat: true

  # LCtrl-U -> Cmd-Tab
  - type: basic
    from:
      key_code: u
      modifiers:
        mandatory:
        - left_control
    to:
    - key_code: tab
      modifiers:
      - control
      repeat: true

  # # LCtrl-Space -> Ctrl-Space, Eisuu
  # # Raycast 用の設定。
  # # Raycast 側の言語切替では切替精度が低いため、こちらで対応する。
  #
  # # 挙動に問題があるため無効化中。
  # # 例えば Ctrl-J で日本語入力へ切替 -> すぐ Space を押しながら変換開始というときに、
  # # Ctrl の離し際と Space の押し際が重なり、Ctrl-Space が誤爆してしまうようだ。
  # # Ctrl -> Space のローリング打鍵のときは発火せず、Ctrl を離す前に Space を離したときだけ
  # # 発火する実装にする必要があるかもしれない。
  #
  # - type: basic
  #   from:
  #     key_code: spacebar
  #     modifiers:
  #       mandatory:
  #       - left_control
  #   to:
  #   - key_code: left_shift
  #     modifiers:
  #     - control
  #     repeat: false
  #   to_if_alone:
  #   - key_code: spacebar
  #     modifiers:
  #     - control
  #   - key_code: japanese_eisuu
  #     repeat: true

  # }}}
